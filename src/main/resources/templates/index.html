<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Spotify Wrap</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="home-page">
<main class="home-shell">
    <div class="home-copy">
        <p class="eyebrow">SPOTIFY WRAP <span class="dot">•</span></p>
        <h1>Your music,<br><em>beautifully told.</em></h1>
        <p class="intro">The artists, songs, and moods that made your listening yours. Connect Spotify and let your story unfold.</p>
        <button class="button button-large" id="start-wrap">Reveal my wrap <span aria-hidden="true">↗</span></button>
        <p class="microcopy">Secure Spotify connection · Takes less than a minute</p>
    </div>
    <div class="home-art" aria-hidden="true">
        <div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div>
        <div class="art-card art-card-back">YOUR<br>VIBE</div><div class="art-card art-card-front">LISTEN<br><span>LOUDER</span></div>
        <span class="art-star star-one">✦</span><span class="art-star star-two">✦</span>
    </div>
</main>
<script>
    if (window.location.hostname === "localhost") window.location.replace("http://127.0.0.1:" + window.location.port + window.location.pathname + window.location.search);
    const start = document.querySelector("#start-wrap");
    start.addEventListener("click", async () => {
        start.disabled = true; start.innerHTML = "Getting things ready <span aria-hidden=\"true\">…</span>";
        try { const response = await fetch("/api/me"); const account = await response.json().catch(() => ({})); window.location.href = response.ok && account.authenticated ? "/wrap?autogenerate=1" : "/oauth2/authorization/spotify"; }
        catch (error) { window.location.href = "/oauth2/authorization/spotify"; }
    });
</script>
</body>
</html>
