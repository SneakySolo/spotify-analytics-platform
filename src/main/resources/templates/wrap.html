<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Spotify Wrap</title><link rel="stylesheet" href="/css/app.css"></head><body class="wrap-page"><main class="wrap-shell"><nav class="wrap-nav"><a class="back-link" href="/">← Back home</a><span>SPOTIFY WRAP <span class="dot">•</span></span></nav><section id="loading" class="loading-state"><p class="eyebrow">YOUR PERSONAL LISTENING STORY</p><h1>Gathering your<br><em>good noise…</em></h1><div class="loader"></div></section><section id="result" hidden></section></main><script>
const result=document.querySelector('#result'),loading=document.querySelector('#loading');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))} function metric(m,fallback='Unavailable'){return m?.available?(m.unit==='percent'?Math.round(m.value)+'%':m.unit==='estimated milliseconds'?Math.round(m.value/60000)+' minutes':Math.round(m.value)+' '+m.unit):fallback} function img(url){return url?`<img class="slide-image" src="${esc(url)}" alt="" onerror="this.style.display='none'">`:''}
function list(items,artist){return Array.isArray(items)&&items.length?'<ol class="track-list">'+items.slice(0,5).map((x,i)=>`<li>${img(artist?x.imageUrl:x.imageUrl)}<span class="track-number">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(x.name)}</strong><small>${esc(artist?'':x.artist?.name||'')}</small></span></li>`).join('')+'</ol>':'<p class="muted">Spotify did not return enough data for this slide.</p>'}
function render(d){const p=d.profile||{},slides=[`<p class="card-label">SLIDE 01 / 13</p>${img(p.imageUrl)}<h2>${esc(p.displayName||'Your')}<br><em>Wrapped.</em></h2><p>Your listening story, based on Spotify data available right now.</p>`,`<p class="card-label">SLIDE 02 / 13 · ACTUAL SPOTIFY COUNT</p><h2>${esc(d.savedTrackCount)}<br><em>liked songs.</em></h2><p>Tracks currently saved in your Spotify library.</p>`,`<p class="card-label">SLIDE 03 / 13 · LONG-TERM AFFINITY</p><h2>Your top<br><em>tracks.</em></h2>${list(d.topTracks)}`,`<p class="card-label">SLIDE 04 / 13 · LONG-TERM AFFINITY</p><h2>Your top<br><em>artists.</em></h2>${list(d.topArtists,true)}`,`<p class="card-label">SLIDE 05 / 13 · ESTIMATE</p><h2>${metric(d.estimatedListeningTime,'Not enough data')}<br><em>estimated.</em></h2><p>${esc(d.estimatedListeningTime?.note||'Recent sample only; not yearly or lifetime listening time.')}</p>`,`<p class="card-label">SLIDE 06 / 13 · RECENT SAMPLE</p><h2>${metric(d.totalTracksListened)}<br><em>unique tracks.</em></h2><p>Tracks in the available recently played sample.</p>`,`<p class="card-label">SLIDE 07 / 13 · RECENT SAMPLE</p><h2>${metric(d.totalAlbumsListened)}<br><em>unique albums.</em></h2><p>Albums represented in the available recently played sample.</p>`,`<p class="card-label">SLIDE 08 / 13 · ARTIST REPRESENTATION</p><h2>Your top<br><em>genres.</em></h2>${d.topGenres?.length?'<ol class="track-list">'+d.topGenres.map(g=>`<li><span class="track-number">${g.artistCount}</span><span><strong>${esc(g.genre)}</strong><small>artist representations</small></span></li>`).join('')+'</ol>':'<p class="muted">Spotify returned insufficient genre information.</p>'}`,`<p class="card-label">SLIDE 09 / 13 · AFFINITY COMPARISON</p><h2>Hidden<br><em>gems.</em></h2>${list(d.hiddenGems)}<p>Long-term favourites absent from your current short-term top tracks—not proof they were never played recently.</p>`,`<p class="card-label">SLIDE 10 / 13 · OUR SCORE</p><h2>${metric(d.tasteDiversityScore)}<br><em>taste diversity.</em></h2><p>${esc(d.tasteDiversityScore?.note||'Shannon entropy across primary artists in your top-track sample.')}</p>`,`<p class="card-label">SLIDE 11 / 13 · OUR SCORE</p><h2>${metric(d.tasteEvolutionScore)}<br><em>taste evolution.</em></h2><p>Your top-track affinity set has changed by this amount between long-term and short-term samples.</p>`,`<p class="card-label">SLIDE 12 / 13 · OUR SCORE</p><h2>${metric(d.replayIntensityScore)}<br><em>replay intensity.</em></h2><p>${esc(d.replayIntensityScore?.note||'Repeat intensity in the recent sample, not actual Spotify play counts.')}</p>`,`<p class="card-label">SLIDE 13 / 13</p><h2>Keep listening,<br><em>keep discovering.</em></h2><p>${esc(d.outro||"That's your Wrap for now!")}</p>`];return `<div class="carousel-heading"><p class="eyebrow">YOUR PERSONAL LISTENING STORY</p><h1>Your music,<br><em>in full colour.</em></h1><p class="wrap-lede">Use the arrows to move through your story.</p></div><div class="carousel" aria-live="polite">${slides.map((s,i)=>`<div class="story-card ${i?'':'active'}"><div class="story-card-content">${s}</div></div>`).join('')}</div><div class="carousel-controls"><button class="arrow-button" id="previous">←</button><div class="progress-dots">${slides.map((_,i)=>`<span class="${i?'':'current'}"></span>`).join('')}</div><button class="arrow-button" id="next">→</button></div>`}
function activate(){const cards=[...document.querySelectorAll('.story-card')],dots=[...document.querySelectorAll('.progress-dots span')],prev=document.querySelector('#previous'),next=document.querySelector('#next');let i=0;function show(n){i=Math.max(0,Math.min(cards.length-1,n));cards.forEach((c,j)=>c.classList.toggle('active',i===j));dots.forEach((d,j)=>d.classList.toggle('current',i===j));prev.disabled=i===0;next.disabled=i===cards.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);show(0)}
async function csrf(){const r=await fetch('/api/csrf');const t=await r.json();return {[t.headerName]:t.token}} async function generate(){try{const r=await fetch('/wraps',{method:'POST',headers:await csrf()}),d=await r.json();if(r.status===401)throw Error("Spotify needs to be connected again. <a href='/oauth2/authorization/spotify'>Reconnect Spotify</a>");if(!r.ok)throw Error(d.message||'We could not generate your wrap.');loading.hidden=true;result.hidden=false;result.innerHTML=render(d);activate()}catch(e){loading.innerHTML=`<p class="eyebrow">A SMALL DETOUR</p><h1>We couldn't find<br><em>your wrap.</em></h1><p class="error-copy">${e.message}</p><a class="button" href="/">Back home</a>`}}generate();
</script></body></html>
