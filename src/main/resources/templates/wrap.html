<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your Spotify Wrap</title><link rel="stylesheet" href="/css/app.css">
</head>
<body class="wrap-page">
<main class="wrap-shell">
    <nav class="wrap-nav"><a class="back-link" href="/">← Back home</a><span>SPOTIFY WRAP <span class="dot">•</span></span></nav>
    <section id="loading" class="loading-state"><p class="eyebrow">YOUR PERSONAL LISTENING STORY</p><h1>Gathering your<br><em>good noise…</em></h1><div class="loader"></div></section>
    <section id="result" hidden></section>
</main>
<script>
const result = document.querySelector('#result'), loading = document.querySelector('#loading');
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function image(url, className = '') { return url ? `<img class="${className}" src="${esc(url)}" alt="" onerror="this.style.display='none'">` : ''; }
function value(metric, fallback = 'Unavailable') {
    if (!metric?.available) return fallback;
    if (metric.unit === 'percent') return `${Math.round(metric.value)}%`;
    if (metric.unit === 'estimated milliseconds') return `${Math.round(metric.value / 60000)} minutes`;
    return Math.round(metric.value);
}
function duration(metric, fallback = 'Unavailable') {
    if (!metric?.available) return fallback;
    const minutes = Math.round(metric.value / 60000), hours = Math.floor(minutes / 60), remaining = minutes % 60;
    return hours > 0 ? `${hours}h ${remaining}m` : `${minutes}m`;
}
function anomaly(metric) {
    return metric?.available && Number(metric.value) === 0
        ? `<p class="metric-anomaly">Wow — an anomaly. This metric came out to 0${metric.unit === 'percent' ? '%' : ''}.</p>` : '';
}
function trackList(items, artists = false, firstNumber = 1) {
    if (!Array.isArray(items) || !items.length) return '<p class="muted">Spotify did not return enough data for this slide.</p>';
    return `<ol class="track-list">${items.slice(0, 5).map((item, index) => `<li>${image(item.imageUrl)}<span class="track-number">${String(index + firstNumber).padStart(2, '0')}</span><span><strong>${esc(item.name)}</strong><small>${esc(artists ? '' : item.artist?.name || '')}</small></span></li>`).join('')}</ol>`;
}
function rankedFeature(items, artists = false) {
    if (!Array.isArray(items) || !items.length) return '<p class="muted">Spotify did not return enough data for this slide.</p>';
    const first = items[0];
    return `<div class="ranked-feature"><div class="ranked-feature-lead">${image(first.imageUrl, 'ranked-feature-image')}<div class="ranked-feature-name"><span class="track-number">01</span><strong>${esc(first.name)}</strong></div><small>${esc(artists ? 'No. 1 artist' : first.artist?.name || 'No. 1 track')}</small></div><div class="ranked-feature-list">${trackList(items.slice(1), artists, 2)}</div></div>`;
}
function description(text) { return `<p class="metric-description">${esc(text)}</p>`; }
function tasteChanges(changes) {
    const difference = value(changes?.differencePercent, 'Not enough data');
    const discoveries = value(changes?.discoveredFavorites, 'Not enough data');
    return `<div class="taste-changes"><p>Your recent taste is <strong>${esc(difference)}</strong> different from your usual favorites.</p><p>You discovered <strong>${esc(discoveries)}</strong> newer favorites.</p></div>`;
}
function routine(routine) {
    if (!routine?.available) return '<p class="muted">Spotify did not return enough recent timestamps for this slide.</p>';
    return `<div class="routine-card"><div class="routine-item"><strong>${esc(routine.peakTime)}</strong><span>go-to listening time</span></div><div class="routine-item"><strong>${esc(routine.peakDay)}</strong><span>go-to listening day</span></div></div>${description('Recently, you have been listening most around ' + routine.peakTime + ' on ' + routine.peakDay + '. This reflects the recent Spotify sample, not your all-time routine.')}`;
}
function comfortArtist(comfort) {
    if (!comfort?.artist) return '<p class="muted">Spotify did not return enough recent artist data for this slide.</p>';
    return `<div class="comfort-artist">${image(comfort.artist.imageUrl, 'score-image')}<div><h2>${esc(comfort.artist.name || 'Your favorite')}</h2><p><strong>${esc(value(comfort.sharePercent))}</strong> of artists in your recent sample.</p></div></div>${description('Recently, ' + (comfort.artist.name || 'this artist') + ' has been your go-to listen. This is based on the recent sample, not total lifetime plays.')}`;
}
function render(data) {
    const profile = data.profile || {}, leadTrack = data.topTracks?.[0], leadArtist = data.topArtists?.[0];
    const slides = [
        `<p class="card-label">01 / 13</p><div class="intro-profile">${image(profile.imageUrl, 'intro-profile-image')}<h2>${esc(profile.displayName || 'Your')}<br><em>Wrapped.</em></h2></div><p>Your listening story, based on Spotify data available right now.</p>`,
        `<p class="card-label">02 / 13</p><h2>Your top<br><em>tracks.</em></h2>${rankedFeature(data.topTracks)}`,
        `<p class="card-label">03 / 13</p><h2>${esc(value(data.totalTracksListened))}<br><em>unique tracks.</em></h2>${anomaly(data.totalTracksListened)}${description('Different tracks found in the recent listening sample Spotify provided.')}`,
        `<p class="card-label">04 / 13</p><h2>Your top<br><em>artists.</em></h2>${rankedFeature(data.topArtists, true)}`,
        `<p class="card-label">05 / 13</p><h2>${esc(value(data.totalAlbumsListened))}<br><em>unique albums.</em></h2>${anomaly(data.totalAlbumsListened)}${description('Different albums found in the recent listening sample.')}`,
        `<p class="card-label">06 / 13</p><h2>${esc(duration(data.estimatedListeningTime, 'Not enough data'))}<br><em>recent time.</em></h2><div class="annual-estimate"><div><strong>${esc(duration(data.estimatedYearListeningTime))}</strong><span>calculated year-long estimate</span></div></div>${anomaly(data.estimatedListeningTime)}${description('Your recent listening time was ' + duration(data.estimatedListeningTime, 'unavailable') + ', which works out to roughly ' + duration(data.estimatedYearListeningTime, 'unavailable') + ' across the year. This is an estimate from your available recent days, not verified Spotify listening time.')}`,
        `<p class="card-label">07 / 13</p><h2>As per your<br><em>routine.</em></h2>${routine(data.listeningRoutine)}`,
        `<p class="card-label">08 / 13</p><h2>Your comfort<br><em>artist.</em></h2>${comfortArtist(data.comfortArtist)}`,
        `<p class="card-label">09 / 13</p><h2>What changed in<br><em>your taste?</em></h2>${tasteChanges(data.tasteChanges)}${description('We compare your recent top tracks with your long-term favorites to show what feels new right now.')}`,
        `<p class="card-label">10 / 13</p><h2>Hidden<br><em>gems.</em></h2>${trackList(data.hiddenGems)}${description('Long-term favourites that are missing from your current short-term top tracks — a gentle nudge to revisit them.')}`,
        `<p class="card-label">11 / 13</p><div class="score-with-image">${image(leadTrack?.imageUrl || leadTrack?.artist?.imageUrl, 'score-image')}<div><h2>${esc(value(data.tasteDiversityScore))}<br><em>taste diversity.</em></h2></div></div>${anomaly(data.tasteDiversityScore)}${description('A higher score means your favourite tracks are spread more evenly across artists.')}`,
        `<p class="card-label">12 / 13</p><h2>${esc(value(data.replayIntensityScore))}<br><em>replay intensity.</em></h2>${anomaly(data.replayIntensityScore)}${description('How much repetition appears in the recent sample — not Spotify’s actual play counts.')}`,
        `<div class="outro-slide"><p class="card-label">13 / 13</p><h2>Keep listening,<br><em>keep discovering.</em></h2><p>${esc(data.outro || "That's your Wrap for now!")}</p></div>`
    ];
    return `<div class="carousel-heading"><p class="eyebrow">YOUR PERSONAL LISTENING STORY</p><h1>Your music,<br><em>in full colour.</em></h1><p class="wrap-lede">Use the arrows to move through your story.</p></div><div class="carousel" aria-live="polite">${slides.map((slide, index) => `<div class="story-card ${index ? '' : 'active'}"><div class="story-card-content">${slide}</div></div>`).join('')}</div><div class="carousel-controls"><button class="arrow-button" id="previous">←</button><div class="progress-dots">${slides.map((_, index) => `<span class="${index ? '' : 'current'}"></span>`).join('')}</div><button class="arrow-button" id="next">→</button></div>`;
}
function activate() { const cards = [...document.querySelectorAll('.story-card')], dots = [...document.querySelectorAll('.progress-dots span')], previous = document.querySelector('#previous'), next = document.querySelector('#next'); let index = 0; function show(nextIndex) { index = Math.max(0, Math.min(cards.length - 1, nextIndex)); cards.forEach((card, i) => card.classList.toggle('active', i === index)); dots.forEach((dot, i) => dot.classList.toggle('current', i === index)); previous.disabled = index === 0; next.disabled = index === cards.length - 1; } previous.onclick = () => show(index - 1); next.onclick = () => show(index + 1); show(0); }
async function readJson(response) {
    const body = await response.text();
    if (!body.trim()) return {};
    try { return JSON.parse(body); }
    catch (_) { return {message: body}; }
}
async function csrf() {
    const response = await fetch('/api/csrf', {headers: {'Accept': 'application/json'}});
    const token = await readJson(response);
    if (!response.ok || !token.headerName || !token.token) throw Error('Your session expired. Please reconnect Spotify.');
    return {[token.headerName]: token.token};
}
function showError(message) {
    loading.innerHTML = `<p class="eyebrow">A SMALL DETOUR</p><h1>We couldn't find<br><em>your wrap.</em></h1><p class="error-copy">${message}</p><a class="button" href="/oauth2/authorization/spotify">Reconnect Spotify</a>`;
}
async function generate() {
    try {
        const response = await fetch('/wraps', {method: 'POST', headers: await csrf()}), data = await readJson(response);
        if (response.status === 401) throw Error("Spotify needs to be connected again.");
        if (!response.ok) throw Error(data.message || 'We could not generate your wrap.');
        if (!data || !data.topTracks) throw Error('Spotify returned an incomplete wrap. Please reconnect and try again.');
        loading.hidden = true; result.hidden = false; result.innerHTML = render(data); activate();
    } catch (error) { showError(error.message || 'We could not generate your wrap.'); }
}
const oauthError = new URLSearchParams(window.location.search).get('oauth_error');
if (oauthError === 'spotify_rate_limited') showError('Spotify is temporarily rate-limiting this app. Wait a few minutes, then reconnect.');
else if (oauthError) showError('Spotify could not complete the connection. Please reconnect and try again.');
else generate();
</script>
</body>
</html>
