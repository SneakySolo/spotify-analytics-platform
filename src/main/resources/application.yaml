spring:
  application:
    name: spotify-analytics-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/spotify_analytics}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPOTIFY_CLIENT_ID:}
            client-secret: ${SPOTIFY_CLIENT_SECRET:}
            redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/spotify}
            authorization-grant-type: authorization_code
            scope: user-read-private,user-read-email,user-top-read,user-read-recently-played
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: id
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${PORT:8080}

cache:
  wrap:
    ttl: ${WRAP_CACHE_TTL:15m}

performance:
  disable-wrap-cache: ${PERFORMANCE_DISABLE_WRAP_CACHE:false}

encryption:
  key: ${TOKEN_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
