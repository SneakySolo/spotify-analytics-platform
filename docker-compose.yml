services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: spotify_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spotify-analytics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotify_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory-policy volatile-ttl
    networks:
      - spotify-analytics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
networks:
  spotify-analytics-network:
    driver: bridge

volumes:
  postgres-data:
